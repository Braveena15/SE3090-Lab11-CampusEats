name: CampusEats CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campuseats_ci
          POSTGRES_DB: campuseats_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campuseats_ci -d campuseats_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=campuseats_test;Username=campuseats_ci
      Jwt__Issuer: CampusEats
      Jwt__Audience: CampusEats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate ephemeral JWT signing key
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "Jwt__Key=$key" >> "$GITHUB_ENV"
      - run: dotnet restore CampusEats.sln
      - run: dotnet tool restore
      - run: dotnet build CampusEats.sln -c Release --no-restore
      - run: dotnet ef database update --project backend/CampusEats.Api --configuration Release --no-build
      - run: dotnet ef migrations has-pending-model-changes --project backend/CampusEats.Api --configuration Release --no-build
      - run: dotnet test CampusEats.sln -c Release --no-build --logger trx
      - run: docker build -t campuseats-api:ci backend
