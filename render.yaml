# Optional Blueprint configuration. Do not apply until you approve deployment.
services:
  - type: web
    name: campuseats-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: Database__ApplyMigrations
        value: "true"
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: CampusEats
      - key: Jwt__Audience
        value: CampusEats
      - key: Cors__AllowedOrigins__0
        sync: false
